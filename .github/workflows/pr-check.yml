name: PR Check - Tests and Ruff

on:
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Ruff check
        run: ruff check ./src/  # ← БЕЗ --config!
      
      - name: Run unit tests
        run: |
          cd src
          python -m pytest test_class_car.py -v
