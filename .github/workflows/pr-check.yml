name: PR Check - Ruff and Tests
on:
  pull_request:
    branches:
      - main
      - master
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Ruff linter
        run: ruff check --config=ruff.toml ./src/
      - name: Run pytest
        run: |
          cd src
          python -m pytest test_class_car.py -v
